<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="236" viewBox="0 0 1010 236">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<rect width="1010" height="236" fill="#fff"/>
<rect x="1" y="2" width="196" height="230" rx="12" fill="#fff" stroke="#d6d1c2" stroke-width="2"/>
<g transform="translate(0 2)"><circle cx="86" cy="62" r="32" fill="#1d2433" stroke="#fff" stroke-width="3"/><text x="86" y="75" text-anchor="middle" font-size="34" font-weight="bold" fill="#fff" font-family="Segoe UI,Arial,Helvetica,sans-serif">3</text><circle cx="116" cy="92" r="15" fill="#fff" stroke="#1d2433" stroke-width="2.5"/><text x="116" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2433" font-family="Segoe UI,Arial,Helvetica,sans-serif">1</text></g>
<text x="99" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">Price</text>
<text x="99" y="184" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Dark circle: coins.</text>
<text x="99" y="202" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Blue: small number</text>
<text x="99" y="220" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">= price to replay.</text>
<rect x="204" y="2" width="196" height="230" rx="12" fill="#fff" stroke="#d6d1c2" stroke-width="2"/>
<g transform="translate(203 2)"><rect x="42" y="22" width="112" height="46" rx="23.0" fill="#8e44c8"/><line x1="98.0" y1="29" x2="98.0" y2="61" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="51.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text><text x="126.0" y="51.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">0</text><line x1="98" y1="74" x2="98" y2="98" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="98" cy="120" r="18" fill="#8e44c8" stroke="#fff" stroke-width="2.5"/><text x="98" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="Georgia,serif">L</text></g>
<text x="302" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">Goal colour</text>
<text x="302" y="184" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Circle colour =</text>
<text x="302" y="202" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">the figure it moves.</text>
<text x="302" y="220" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Use every matrix.</text>
<rect x="407" y="2" width="196" height="230" rx="12" fill="#fff" stroke="#d6d1c2" stroke-width="2"/>
<g transform="translate(406 2)"><clipPath id="sl"><rect x="42" y="18" width="56.0" height="50"/></clipPath><g opacity=".28"><rect x="42" y="20" width="112" height="46" rx="23.0" fill="#f06a12"/><line x1="98.0" y1="27" x2="98.0" y2="59" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−2</text><text x="126.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text></g><g clip-path="url(#sl)"><rect x="42" y="20" width="112" height="46" rx="23.0" fill="#f06a12"/><line x1="98.0" y1="27" x2="98.0" y2="59" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−2</text><text x="126.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text></g><line x1="60" y1="82" x2="60" y2="142" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="78" y="100" text-anchor="start" font-size="20" fill="#1d2433" font-family="Georgia,serif"><tspan font-weight="bold">+</tspan>  up</text><text x="78" y="136" text-anchor="start" font-size="20" fill="#1d2433" font-family="Georgia,serif"><tspan font-weight="bold">−</tspan>  down</text></g>
<text x="505" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">Left number</text>
<text x="505" y="184" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Probability: the rows.</text>
<text x="505" y="202" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Minus: figure goes down.</text>
<text x="505" y="220" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Plus: it goes up.</text>
<rect x="610" y="2" width="196" height="230" rx="12" fill="#fff" stroke="#d6d1c2" stroke-width="2"/>
<g transform="translate(609 2)"><clipPath id="sr"><rect x="98.0" y="18" width="56.0" height="50"/></clipPath><g opacity=".28"><rect x="42" y="20" width="112" height="46" rx="23.0" fill="#f06a12"/><line x1="98.0" y1="27" x2="98.0" y2="59" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−2</text><text x="126.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text></g><g clip-path="url(#sr)"><rect x="42" y="20" width="112" height="46" rx="23.0" fill="#f06a12"/><line x1="98.0" y1="27" x2="98.0" y2="59" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−2</text><text x="126.0" y="49.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text></g><line x1="22" y1="98" x2="176" y2="98" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="22" y="128" text-anchor="start" font-size="20" fill="#1d2433" font-family="Georgia,serif"><tspan font-weight="bold">−</tspan>  left</text><text x="176" y="128" text-anchor="end" font-size="20" fill="#1d2433" font-family="Georgia,serif"><tspan font-weight="bold">+</tspan>  right</text></g>
<text x="708" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">Right number</text>
<text x="708" y="184" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Impact: the columns.</text>
<text x="708" y="202" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Minus: figure goes left.</text>
<text x="708" y="220" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">Plus: it goes right.</text>
<rect x="813" y="2" width="196" height="230" rx="12" fill="#fff" stroke="#d6d1c2" stroke-width="2"/>
<g transform="translate(812 2)"><clipPath id="sz"><rect x="98.0" y="28" width="56.0" height="50"/></clipPath><g opacity=".28"><rect x="42" y="30" width="112" height="46" rx="23.0" fill="#8e44c8"/><line x1="98.0" y1="37" x2="98.0" y2="69" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="59.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text><text x="126.0" y="59.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">0</text></g><g clip-path="url(#sz)"><rect x="42" y="30" width="112" height="46" rx="23.0" fill="#8e44c8"/><line x1="98.0" y1="37" x2="98.0" y2="69" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.5"/><text x="70.0" y="59.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">−1</text><text x="126.0" y="59.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Segoe UI,Arial,Helvetica,sans-serif">0</text></g><circle cx="98" cy="112" r="18" fill="#8e44c8" stroke="#fff" stroke-width="2.5"/><text x="98" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff" font-family="Georgia,serif">L</text><text x="128" y="118" text-anchor="start" font-size="15" fill="#333" font-family="Georgia,serif">stays</text></g>
<text x="911" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">Zero</text>
<text x="911" y="184" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">No move on this side.</text>
<text x="911" y="202" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">A figure stays</text>
<text x="911" y="220" text-anchor="middle" font-size="14" fill="#333" font-family="Georgia,serif">between <tspan font-family="Segoe UI,Arial,Helvetica,sans-serif">1</tspan> and <tspan font-family="Segoe UI,Arial,Helvetica,sans-serif">4</tspan>.</text>
