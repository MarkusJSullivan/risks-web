<text x="820" y="400" text-anchor="start" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">Zero</text>
<text x="820" y="426" text-anchor="start" font-size="14" fill="#333" font-family="Georgia,serif">Nothing moves on</text>
<text x="820" y="447" text-anchor="start" font-size="14" fill="#333" font-family="Georgia,serif">this side. A figure stays</text>
<text x="820" y="468" text-anchor="start" font-size="14" fill="#333" font-family="Georgia,serif">between <tspan font-family="Segoe UI,Arial,Helvetica,sans-serif">1</tspan> and <tspan font-family="Segoe UI,Arial,Helvetica,sans-serif">4</tspan>.</text>
<text x="10" y="552" text-anchor="start" font-size="18" font-weight="bold" fill="#1d2433" font-family="Georgia,serif">The seven goals and their colours (the figures on the matrix)</text>
