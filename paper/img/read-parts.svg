<circle cx="524" cy="576" r="13" fill="#1f5fd6" stroke="#fff" stroke-width="2"/>
<text x="524" y="582" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Georgia,serif">I</text>
<text x="546" y="582" text-anchor="start" font-size="15" fill="#1d2433" font-family="Georgia,serif">Integrity</text>
